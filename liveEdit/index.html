<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/png" href="assets/favicon.ico">
    <title>pixel-mark editor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, sans-serif;
            background: #f5f5f5;
        }

        .app {
            width: min(1400px, 100%);
            margin: 0 auto;
            padding: 16px;
        }

        .editor {
            width: 100%;
            height: min(900px, calc(100vh - 32px));

            border: 0;
            border-radius: 8px;
            background: white;

            display: block;
        }
    </style>
</head>

<body>
<img style="position: absolute;right: 5px;margin-right:5px;margin-top:1px ;height: 38px" src="assets/logo/logo.svg">
<div class="app">
    <iframe
            class="editor"
            src="editor.html"
            sandbox="allow-scripts allow-same-origin">
    </iframe>
</div>

</body>
</html>
