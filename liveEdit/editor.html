<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>pixel-mark example</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script src="../dist/pixel_mark.umd.js"></script>
    <script src="./main.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/favicon.ico">
</head>
<body style="min-width: 1200px">
<div class="editor">

    <section class="chart-panel">

        <div class="chart-container">
            <svg
                    id="main"
                    viewBox="0 0 800 600"
                    preserveAspectRatio="xMidYMid meet">
            </svg>
        </div>

    </section>


    <section class="code-panel">

        <h3>Live Edit</h3>

        <textarea id="code">

svg
    .selectAll("dot")
    .data(dataset)
    .enter()
    .append("image")
    .attr("x", d =>
        xScale(d["First Inauguration Date"])
    )
    .attr("y", d => yScale(d.opinion))
    .attr("width", 40)
    .fit("saliencyCrop")
    .shape("hexagon")
    .transform("hexbin",0.5)



        </textarea>

        <div id="error"></div>

    </section>

</div>

</body>
</html>
